<div class="contact-container">
    <h2>Contact Us</h2>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" formControlName="name" class="form-control" placeholder="Enter your name" />
        <small class="error" *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
          Name is required (Min: 3 characters)
        </small>
      </div>
  
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="Enter your email" />
        <small class="error" *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
          Valid email is required
        </small>
      </div>
  
      <!-- Phone Field -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" formControlName="phone" class="form-control" placeholder="Enter your phone number" />
        <small class="error" *ngIf="contactForm.get('phone')?.invalid && contactForm.get('phone')?.touched">
          Valid phone number is required
        </small>
      </div>
  
      <!-- Message Field -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" formControlName="message" class="form-control" rows="4" placeholder="Enter your message"></textarea>
        <small class="error" *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
          Message must be at least 10 characters
        </small>
      </div>
  
      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" [disabled]="contactForm.invalid">Submit</button>
  
      <!-- Success Message -->
      <div *ngIf="submitted" class="success-message">
        Your message has been sent successfully!
      </div>
  
    </form>
  </div>
