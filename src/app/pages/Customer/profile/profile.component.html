<div class="container mt-5 pt-5">
  <div class="card p-4 rounded-lg shadow-sm">
    <!-- Profile Image with Upload Icon -->
    <div class="text-center mb-4 position-relative profile-image-container">
      <img
        [src]="profile.imageUrl"
        alt="User Image"
        class="profile-image rounded-circle"
      />
      <label for="imageUpload" class="camera-icon position-absolute">
        <i class="bi bi-camera"></i>
      </label>
      <input type="file" id="imageUpload" hidden (change)="onImageUpload($event)" />
    </div>

    <!-- Profile Form -->
    <form>
      <div class="row">
        <!-- Left Column -->
        <div class="col-md-6">
          <div class="form-group">
            <label for="name">Name*</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="profile.name" name="name" />
          </div>

          <div class="form-group">
            <label for="phone">Phone No.*</label>
            <input type="text" class="form-control" id="phone" [(ngModel)]="profile.phone" name="phone" />
          </div>

          <div class="form-group">
            <label for="country">Country*</label>
            <input type="text" id="country" class="form-control" />
          </div>

          <div class="form-group">
            <label for="permanentAddress">Permanent Address*</label>
            <input type="text" id="permanentAddress" class="form-control" />
          </div>
        </div>

        <!-- Right Column -->
        <div class="col-md-6">
          <div class="form-group">
            <label for="email">Email*</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="profile.email" name="email" />
          </div>

          <div class="form-group">
            <label for="birthday">Birthday*</label>
            <input type="date" id="birthday" class="form-control" />
          </div>

          <div class="form-group">
            <label for="state">State*</label>
            <input type="text" id="state" class="form-control" />
          </div>
        </div>
      </div>

      <!-- Additional Addresses -->
      <h5 class="text-primary mt-4">Add Additional Address</h5>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="officeAddress">Office Address*</label>
            <input type="text" id="officeAddress" class="form-control" />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="homeAddress">Home Address*</label>
            <input type="text" id="homeAddress" class="form-control" />
          </div>
        </div>
      </div>

      <!-- Update Button -->
      <button type="button" class="btn btn-danger btn-block mt-4" (click)="updateProfile()">Update Changes</button>
    </form>
  </div>
</div>
