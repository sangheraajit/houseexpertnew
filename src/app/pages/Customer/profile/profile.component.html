<div class="container mt-5">
  <div class="card p-4 rounded-lg shadow-sm">
    <!-- Header Section with Go Back and Edit Buttons -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <button class="btn btn-outline-danger" (click)="goBack()">Go to back</button>
      <button class="btn btn-outline-primary" (click)="editProfile()">Edit</button>
    </div>

    <!-- Profile Image with Upload Icon -->
    <div class="text-center mb-4 position-relative profile-image-container">
      <img
        [src]="profile.imageUrl || 'https://via.placeholder.com/100'"
        alt="User Image"
        class="profile-image rounded-circle"
      />
      <label for="imageUpload" class="camera-icon position-absolute">
        <i class="bi bi-camera"></i>
      </label>
      <input type="file" id="imageUpload" hidden (change)="onImageUpload($event)" />
    </div>

    <!-- Profile Form (same as before) -->
    <form>
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name*</label>
        <input type="text" class="form-control" id="name"
        [(ngModel)]="profile.name"
        name="name" />
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email*</label>
        <input type="email"  class="form-control" id="email"
        [(ngModel)]="profile.email"
        name="email" />
      </div>

      <!-- Phone and Birthday Fields Row -->
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="phone">Phone No.*</label>
          <input type="text"  class="form-control" id="phone"
          [(ngModel)]="profile.phone"
          name="phone" />
        </div>
        <div class="form-group col-md-6">
          <label for="birthday">Birthday*</label>
          <input type="date" id="birthday" class="form-control"  />
        </div>
      </div>

      <!-- Country and State Fields Row -->
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="country">Country*</label>
          <input type="text" id="country" class="form-control"  />
        </div>
        <div class="form-group col-md-6">
          <label for="state">State*</label>
          <input type="text" id="state" class="form-control"  />
        </div>
      </div>

      <!-- Permanent Address Field -->
      <h5 class="text-primary">Permanent Address</h5>
      <div class="form-group">
        <label for="permanentAddress">Address*</label>
        <input type="text" id="permanentAddress" class="form-control"  />
      </div>

      <!-- Additional Addresses Fields -->
      <h5 class="text-primary">Add Additional Address</h5>
      <div class="form-row align-items-end">
        <div class="form-group col-md-6">
          <label for="officeAddress">Office Address*</label>
          <input type="text" id="officeAddress" class="form-control"  />
        </div>
        <div class="form-group col-md-6">
          <label for="homeAddress">Home Address*</label>
          <input type="text" id="homeAddress" class="form-control" />
        </div>
      </div>

      <!-- Update Button -->
      <button type="button" class="btn btn-danger btn-block mt-4" (click)="updateProfile()">Update Changes</button>
    </form>
  </div>
</div>
